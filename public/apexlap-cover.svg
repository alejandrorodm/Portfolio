<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'Outfit','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="ax-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="ax-speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="ax-glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="440" fill="url(#ax-bg)"/>
  <rect width="800" height="440" fill="url(#ax-glow)"/>
  <!-- speed lines -->
  <g stroke="url(#ax-speed)" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="120" y1="130" x2="300" y2="130"/>
    <line x1="90" y1="160" x2="340" y2="160"/>
    <line x1="140" y1="300" x2="320" y2="300"/>
    <line x1="100" y1="330" x2="290" y2="330"/>
  </g>
  <!-- gauge -->
  <g transform="translate(400 230)">
    <path d="M-130 0 A130 130 0 0 1 130 0" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round"/>
    <path d="M-130 0 A130 130 0 0 1 70 -109" fill="none" stroke="url(#ax-speed)" stroke-width="18" stroke-linecap="round"/>
    <!-- ticks -->
    <g stroke="#475569" stroke-width="3">
      <line x1="-110" y1="0" x2="-128" y2="0"/>
      <line x1="-78" y1="-78" x2="-90" y2="-90"/>
      <line x1="0" y1="-110" x2="0" y2="-128"/>
      <line x1="78" y1="-78" x2="90" y2="-90"/>
      <line x1="110" y1="0" x2="128" y2="0"/>
    </g>
    <!-- needle -->
    <line x1="0" y1="0" x2="62" y2="-86" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#f8fafc"/>
    <text x="0" y="-26" text-anchor="middle" fill="#93c5fd" font-size="26" font-weight="800">1:32.486</text>
    <text x="0" y="2" text-anchor="middle" fill="#64748b" font-size="13" font-weight="600" letter-spacing="2">BEST LAP</text>
  </g>
  <!-- checkered flag -->
  <g transform="translate(610 120)">
    <rect x="0" y="0" width="60" height="40" fill="#0f172a" stroke="#334155"/>
    <g fill="#e2e8f0">
      <rect x="0" y="0" width="15" height="10"/><rect x="30" y="0" width="15" height="10"/>
      <rect x="15" y="10" width="15" height="10"/><rect x="45" y="10" width="15" height="10"/>
      <rect x="0" y="20" width="15" height="10"/><rect x="30" y="20" width="15" height="10"/>
      <rect x="15" y="30" width="15" height="10"/><rect x="45" y="30" width="15" height="10"/>
    </g>
  </g>
  <text x="400" y="416" text-anchor="middle" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="2">ApexLap</text>
  <text x="400" y="46" text-anchor="middle" fill="#c084fc" font-size="15" font-weight="600" letter-spacing="3">LAP TIMES · REACT NATIVE + FIREBASE</text>
</svg>
