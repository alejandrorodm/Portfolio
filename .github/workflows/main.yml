name: Deploy Portfolio Vite

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install & Build
        run: |
          npm install
          npm run build  # Carpeta dist

      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "dist/*"        # Solo enviamos lo que hay dentro de dist
          target: "/var/www/html" # Carpeta de Nginx
          strip_components: 1     # Importante: para que no cree una carpeta /html/dist/